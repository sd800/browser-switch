name: Check app

on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "Package.swift"
      - "BrowserSwitch.xcodeproj/**"
      - "Scripts/build.sh"
      - "Scripts/test.sh"
      - ".github/workflows/check.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "Tests/**"
      - "Resources/**"
      - "Package.swift"
      - "BrowserSwitch.xcodeproj/**"
      - "Scripts/build.sh"
      - "Scripts/test.sh"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run tests
        run: ./Scripts/test.sh
      - name: Check sandbox permissions
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          permissions = plistlib.loads(Path("Resources/BrowserSwitch.entitlements").read_bytes())
          assert permissions == {"com.apple.security.app-sandbox": True}
          PY
      - name: Build universal app and verify archive
        run: ./Scripts/build.sh
